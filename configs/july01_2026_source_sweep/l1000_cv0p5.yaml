stage: dispersion
run: {name: source_heterogeneity_les_source_l1000_cv0p5}
inputs: {}
dispersion:
  transport: {model: microhh, mode: simulation, start: "2026-07-01T12:00:00", end: "2026-07-01T13:00:00"}
  met:
    era5: {meteo_dir: ../../runs/sacramento_valley_2026_july01_point/met}
  domain: {origin_lon: -121.75, origin_lat: 39.15, x_min: -1920.0, x_max: 1920.0, y_min: -960.0, y_max: 960.0, spacing_m: 80.0, receptor_height_m: 3.0}
  sources:
    generator: lognormal_field
    config:
      Q_true_kg_s: 2.7778e-2
      grid: {nx: 48, ny: 24, dx_m: 80.0, origin_x_m: -1920.0, origin_y_m: -960.0}
      alt_m: 2.0
      covariance: {model: exponential, L_m: 1000.0}
      cv: 0.5
      seed: 0
      basis: {coarsen: 4}
      prior: {mean_kg_s_per_cell: 0.0}
  receptors:
    - {id: tower_n, x_m: 0.0, y_m: 650.0, alt_m: 3.0}
    - {id: tower_e, x_m: 600.0, y_m: 0.0, alt_m: 3.0}
    - {id: tower_s, x_m: 0.0, y_m: -650.0, alt_m: 3.0}
  microhh:
    executable: ../../microhh/build/microhh
    num_workers: 4
    grid: {itot: 48, jtot: 24, ktot: 32, xsize: 3840.0, ysize: 1920.0, zsize: 1024.0}
    source_x0: 1920.0
    source_y0: 960.0
    spinup_seconds: 300
    runtime_seconds: 600
    sampletime: 60
    cross_xz_m: 960.0
    met_reduce: mean
