stage: flux
run:
  name: source_heterogeneity_les_rice_paddy_l100_cv1p0_s0_wind3_n4_op_tr
inputs:
  dispersion: ../../../runs/source_heterogeneity_les_rice_paddy_l100_cv1p0_s0_wind3_n4_op_tr_gp/dispersion
  obs: ../../../runs/source_heterogeneity_les_rice_paddy_l100_cv1p0_s0_wind3_n4_op_tr/instrument
flux:
  input:
    mode: instrument_netcdf
    level_index: 0
    time_reduce: none
    time_index_range: [0, 29] # Frames the operator's windows cover
  observations:
    default_sigma: 0.01
    # bLS-versus-LES transport/representation uncertainty in ng m-3.
    sigma_repr: 25000.0
    sigma_repr_fraction: 0.3
    sigma_repr_flux_scale_kg_s: 0.03
  inversion:
    method: nonnegative
    total_only: false
    prior_total_flux_kg_s: 0.0
    prior_total_variance: 1.0
