stage: flux
run:
  name: source_heterogeneity_les_rice_paddy_l100_cv1p0_s0_wind3_n4_op_ctl1
inputs:
  dispersion: ../../../runs/source_heterogeneity_les_rice_paddy_l100_cv1p0_s0_wind3_n4_op_gp/dispersion
  obs: ../../../runs/source_heterogeneity_les_rice_paddy_l100_cv1p0_s0_wind3_n4_op/instrument
flux:
  input:
    mode: instrument_netcdf
    level_index: 0
    time_reduce: mean
  observations:
    default_sigma: 0.01
    # bLS-versus-LES transport/representation uncertainty in ng m-3.
    sigma_repr: 25000.0
    sigma_repr_fraction: 0.3
    sigma_repr_flux_scale_kg_s: 0.03
  inversion:
    method: nonnegative
    total_only: true
    total_template: uniform # No oracle knowledge of the source pattern
    prior_total_flux_kg_s: 0.0
    prior_total_variance: 3.429534e-04 # 9 * (0.006173)^2, matching the 9-cell prior
