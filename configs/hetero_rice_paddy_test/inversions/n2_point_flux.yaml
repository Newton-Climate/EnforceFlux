stage: flux
run:
  name: source_heterogeneity_les_rice_paddy_l200_cv2p0_wind3_n2_point
inputs:
  dispersion: ../../../runs/source_heterogeneity_les_rice_paddy_l200_cv2p0_wind3_n2_point_gp/dispersion
  obs: ../../../runs/source_heterogeneity_les_rice_paddy_l200_cv2p0_wind3_n2_point/instrument
flux:
  input:
    mode: instrument_netcdf
    level_index: 0
    time_reduce: mean
  observations:
    default_sigma: 0.01
    # bLS-versus-LES transport/representation uncertainty in ng m-3.
    sigma_repr: 25000.0
    sigma_repr_fraction: 0.3
    sigma_repr_flux_scale_kg_s: 0.03
  inversion:
    method: nonnegative
    total_only: true
    # Do not use the heterogeneous truth pattern as oracle information.
    total_template: uniform
    prior_total_flux_kg_s: 0.0
    prior_total_variance: 1.0
