# bLSmodelR operator template — sibling of operator.yaml (FLEXPART/AERMOD).
#
# Turbulence intervals feed bLS from either (a) an inline list of MOST windows,
# or (b) LES-diagnosed sonics on an existing MicroHH nature run
# (fraternal-twin OSSE — inversion sees only what a sonic would).
#
# The Jacobian's column order matches ``sources`` (one column per RunSource,
# treated as a square polygon of side ``domain.spacing_m``), so downstream
# inversion and matrices code plug in unchanged.
stage: dispersion
run: {name: TEMPLATE_OPERATOR}
inputs: {}
dispersion:
  transport: {model: blsmodelr, mode: operator, start: '2026-07-01T12:00:00', end: '2026-07-01T13:00:00'}
  met: {}   # bLS gets turbulence stats from intervals, not meteorology files.
  domain: {origin_lon: -121.75, origin_lat: 39.15, x_min: -2200.0, x_max: 2200.0, y_min: -2200.0, y_max: 2200.0, spacing_m: 80.0, receptor_height_m: 3.0, heights_m: [4.0]}
  sources:
    generator: lognormal_field
    config:
      Q_true_kg_s: 2.7778e-2
      grid: {nx: 48, ny: 24, dx_m: 80.0, origin_x_m: -1920.0, origin_y_m: -960.0}
      alt_m: 2.0
      covariance: {model: exponential, L_m: 500.0}
      cv: 1.0
      seed: 0
      basis: {coarsen: 8}
      prior: {mean_kg_s_per_cell: 0.0}
  receptors: []
  blsmodelr:
    # Inline intervals path (simplest). Comment out and use
    # intervals_from_nature: below to run the fraternal-twin OSSE.
    intervals:
      - {id: t0, u_star: 0.35, L: -50.0,   z0: 0.05, wind_dir_deg: 270.0, wind_speed: 3.0, z_ref: 4.0, sd_u: 0.9, sd_v: 0.8, sd_w: 0.5}
      - {id: t1, u_star: 0.28, L: 1000000.0, z0: 0.05, wind_dir_deg: 260.0, wind_speed: 2.5, z_ref: 4.0, sd_u: 0.6, sd_v: 0.5, sd_w: 0.35}
      - {id: t2, u_star: 0.22, L: 60.0,    z0: 0.05, wind_dir_deg: 280.0, wind_speed: 2.0, z_ref: 4.0, sd_u: 0.4, sd_v: 0.35, sd_w: 0.20}
    # intervals_from_nature:
    #   microhh_config: ../../runs/<nature_name>/dispersion/concentration_microhh/microhh_generated.yaml
    #   receptor_id: r_y08
    #   z_ref: 4.0
    #   z0: 0.05
    #   window_s: 300.0
    interval_reduce: mean
    model_params: {n_particles: 50000, max_traj_s: 200, seed: 1}
    wrapper: {rscript: Rscript, dry_run: false, timeout_s: null}
