# ============================================================================
# Source-heterogeneity OSSE — Experiment E3 — Flux stage.
# ============================================================================
#   enforceflux flux --config configs/source_heterogeneity_e3_les_gaussian/flux.yaml
#
# LES pseudo-obs on the observation side; AERMOD (Gaussian) H on the
# inversion side. Structural mismatch is the point of E3 (memo Fig 5).
# ============================================================================

stage: flux

run:
  name: source_heterogeneity_e3_les_gaussian

inputs:
  # AERMOD operator RunDir supplies the (structurally mismatched) H_fine.
  dispersion: ../../runs/source_heterogeneity_e3_les_gaussian_aermod_operator/dispersion
  obs:        ../../runs/source_heterogeneity_e3_les_gaussian/instrument

flux:

  input:
    mode: instrument_netcdf
    level_index: 0

  observations:
    default_sigma: 0.2

  inversion:
    method: linear
    prior_flux_kg_s: 0.0

    prior_covariance:
      model: gaussian_process
      sigma_kg_s: 1.0e-6
      L_B_m: 800.0

    prior_variance: 1.0e-12
    prior_sigma_fraction: 0.5

    n_iter: 20
    lam0: 1.0e-3
    lam_factor: 10.0
    eps: 1.0e-4
    fd_step: 1.0e-5
