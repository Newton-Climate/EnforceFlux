# ============================================================================
# Source-heterogeneity OSSE — Experiment E0 (matched Gaussian ↔ Gaussian)
# Dispersion stage.
# ============================================================================
#   enforceflux dispersion --config configs/source_heterogeneity_e0/dispersion.yaml
#
# E0 is the sanity-check tier of the hierarchy: AERMOD is used both as the
# "nature" transport and as the inversion forward operator, over a nearly
# smooth log-Gaussian source field (CV = 0.1). The E0 test is
# `tests/osse/test_e0_recovers_q_true.py` — posterior `E_Q < 0.02`.
#
# ── STAGE INPUTS/OUTPUTS ────────────────────────────────────────────────────
# Source stage — no upstream `inputs:`. Emits the canonical concentration
# field plus, from the source generator, `truth_field.nc` and the
# `basis_mapping.npz` projector that downstream flux/analysis stages consume.
#
# ── SOURCES: GENERATOR BRANCH (M2) ──────────────────────────────────────────
# The `sources:` block below is a MAPPING (not the historical list). The
# `generator:` key selects the lognormal-field plugin from M1; the loader
# expands it to `list[RunSource]` at RunConfig build time. Runtime plumbing
# activates once M2 lands (Wave 2 — Agent E); this file is the M4-stable
# skeleton owned by Agent J and is valid YAML today.
# ============================================================================

stage: dispersion

run:
  name: source_heterogeneity_e0

inputs: {}

dispersion:

  transport:
    model: aermod
    mode: operator
    start: "2020-03-31T00:00:00"
    end:   "2020-03-31T06:00:00"

  met:
    records:
      - {time: "2020-03-31T00:00", wind_speed_m_s: 2.5, wind_direction_deg: 250.0,
         temperature_k: 285.0, mixing_height_m: 300.0,
         friction_velocity_m_s: 0.20, sensible_heat_flux_w_m2:  -20.0}
      - {time: "2020-03-31T02:00", wind_speed_m_s: 3.0, wind_direction_deg: 260.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T04:00", wind_speed_m_s: 3.5, wind_direction_deg: 270.0,
         temperature_k: 295.0, mixing_height_m: 900.0,
         friction_velocity_m_s: 0.32, sensible_heat_flux_w_m2:  180.0}
      - {time: "2020-03-31T06:00", wind_speed_m_s: 3.5, wind_direction_deg: 275.0,
         temperature_k: 296.0, mixing_height_m: 1000.0,
         friction_velocity_m_s: 0.34, sensible_heat_flux_w_m2:  120.0}

  domain:
    origin_lon: -121.75
    origin_lat: 39.15
    # E0 uses a small 1.6 km x 1.6 km domain matched to the 32 x 32 truth grid.
    x_min: -800.0
    x_max:  800.0
    y_min: -800.0
    y_max:  800.0
    spacing_m: 50.0
    receptor_height_m: 2.0
    heights_m: [100.0]

  # NOTE: the `sources.generator:` branch activates once M2 (Agent E) wires
  # `RunConfig.from_dict` to the lognormal-field plugin. Until then this block
  # is skeleton-only; the schema is stable and parses today.
  sources:
    generator: lognormal_field
    config:
      Q_true_kg_s: 2.7778e-2          # 100 kg/hr, matches configs/main
      grid: {nx: 32, ny: 32, dx_m: 50.0, origin_x_m: -800.0, origin_y_m: -800.0}
      alt_m: 2.0
      covariance: {model: exponential, L_m: 500.0}
      cv: 0.1                         # smooth field — E0 sanity tier
      seed: 42
      basis: {coarsen: 4}             # 8x8 inversion cells over 32x32 truth
      prior: {mean_kg_s_per_cell: 0.0}

  receptors:
    - {id: tower_n, x_m:    0.0, y_m:  650.0, alt_m: 3.0}
    - {id: tower_e, x_m:  600.0, y_m:    0.0, alt_m: 3.0}
    - {id: tower_s, x_m:    0.0, y_m: -650.0, alt_m: 3.0}
    - {id: tower_w, x_m: -600.0, y_m:    0.0, alt_m: 3.0}

  aermod:
    reduce: stack
    default_stack:
      height_m: 2.0
    receptor_path_samples: 1
