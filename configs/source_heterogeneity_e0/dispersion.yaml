# ============================================================================
# Source-heterogeneity OSSE — Experiment E0 (matched Gaussian <-> Gaussian)
# Dispersion stage.
# ============================================================================
#   enforceflux dispersion --config configs/source_heterogeneity_e0/dispersion.yaml
#
# E0 is the sanity-check tier of the hierarchy: AERMOD is used both as the
# nature transport and as the inversion forward operator, over a nearly
# smooth log-Gaussian source field (CV = 0.1). The E0 test is
# `tests/osse/test_e0_recovers_q_true.py` -- posterior E_Q < 0.02.
# ============================================================================

stage: dispersion

run:
  name: source_heterogeneity_e0

inputs: {}

dispersion:

  transport:
    model: aermod
    mode: operator
    start: "2020-03-31T00:00:00"
    end:   "2020-03-31T08:00:00"

  met:
    records:
      - {time: "2020-03-31T00:00", wind_speed_m_s: 2.5, wind_direction_deg:  45.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T01:00", wind_speed_m_s: 2.5, wind_direction_deg: 135.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T02:00", wind_speed_m_s: 2.5, wind_direction_deg: 225.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T03:00", wind_speed_m_s: 2.5, wind_direction_deg: 315.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T04:00", wind_speed_m_s: 2.5, wind_direction_deg:   0.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T05:00", wind_speed_m_s: 2.5, wind_direction_deg:  90.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T06:00", wind_speed_m_s: 2.5, wind_direction_deg: 180.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}
      - {time: "2020-03-31T07:00", wind_speed_m_s: 2.5, wind_direction_deg: 270.0,
         temperature_k: 290.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:   30.0}

  domain:
    origin_lon: -121.75
    origin_lat: 39.15
    x_min: -800.0
    x_max:  800.0
    y_min: -800.0
    y_max:  800.0
    spacing_m: 200.0
    receptor_height_m: 3.0
    heights_m: [100.0]

  sources:
    generator: lognormal_field
    config:
      Q_true_kg_s: 2.7778e-2          # 100 kg/hr, matches configs/main
      grid: {nx: 4, ny: 4, dx_m: 400.0, origin_x_m: -800.0, origin_y_m: -800.0}
      alt_m: 5.0
      covariance: {model: exponential, L_m: 500.0}
      cv: 0.1                         # smooth field -- E0 sanity tier
      seed: 42
      basis: {coarsen: 1}             # inversion on fine grid (no representativeness)
      prior: {mean_kg_s_per_cell: 0.0}

  receptors:
    - {id: tower_ne, x_m:  600.0, y_m:  600.0, alt_m: 3.0}
    - {id: tower_se, x_m:  600.0, y_m: -600.0, alt_m: 3.0}
    - {id: tower_sw, x_m: -600.0, y_m: -600.0, alt_m: 3.0}
    - {id: tower_nw, x_m: -600.0, y_m:  600.0, alt_m: 3.0}
    - {id: tower_n,  x_m:    0.0, y_m:  700.0, alt_m: 3.0}
    - {id: tower_e,  x_m:  700.0, y_m:    0.0, alt_m: 3.0}
    - {id: tower_s,  x_m:    0.0, y_m: -700.0, alt_m: 3.0}
    - {id: tower_w,  x_m: -700.0, y_m:    0.0, alt_m: 3.0}

  aermod:
    reduce: stack
    default_stack:
      height_m: 5.0
    receptor_path_samples: 1
