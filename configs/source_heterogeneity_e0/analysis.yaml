# ============================================================================
# Source-heterogeneity OSSE — Experiment E0 (matched Gaussian <-> Gaussian)
# Analysis stage.
# ============================================================================
#   enforceflux analysis --config configs/source_heterogeneity_e0/analysis.yaml
#
# Reads the upstream E0 dispersion RunDir (basis_mapping.npz + truth_field.nc)
# and the upstream flux posterior; expands the coarse posterior back to the
# fine truth grid to compute E_Q via total_emission_error.
# ============================================================================

stage: analysis

run:
  name: source_heterogeneity_e0

inputs:
  dispersion: ../../runs/source_heterogeneity_e0/dispersion
  flux:       ../../runs/source_heterogeneity_e0/flux

analysis:

  input:
    kind: simulation
    simulation_variable_names: [concentration, ch4_mixing_ratio, ch4_concentration]

  analysis:
    prior_variance: 1.0e-8

  visualization:
    enabled: false
