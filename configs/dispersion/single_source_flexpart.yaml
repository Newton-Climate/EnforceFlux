# Single 100 kg/hr point leak — FLEXPART Lagrangian particles.
#
# Uses the bundled FLEXPART test met (2009-01-01 00Z, 06Z) that ships with
# the flexpart submodule after `make install-flexpart`, so this config runs
# offline without downloading ERA5. The shared MetSeries adapter cannot read
# this reduced GRIB set (missing surface fields like BLH), so the shared
# `met:` block is inline records; FLEXPART bypasses the adapter and reads
# its own GRIBs via flexpart.meteo_dir / flexpart.available_file.
#
# For a real ERA5 run, download with `enforceflux met --config
# configs/met/main.yaml` and point flexpart.meteo_dir at that directory.

stage: dispersion
run:
  name: single_source_flexpart
inputs: {}

dispersion:
  transport:
    model: flexpart
    mode: simulation
    start: "2009-01-01T00:00:00"
    end:   "2009-01-01T06:00:00"

  # The shared met block is required by the runner even though FLEXPART reads
  # its own GRIBs; inline records satisfy the runner.
  met:
    records:
      - {time: "2009-01-01T00:00", wind_speed_m_s: 3.0, wind_direction_deg: 270.0,
         temperature_k: 280.0, mixing_height_m: 400.0,
         friction_velocity_m_s: 0.25, sensible_heat_flux_w_m2:  20.0}
      - {time: "2009-01-01T06:00", wind_speed_m_s: 3.5, wind_direction_deg: 275.0,
         temperature_k: 282.0, mixing_height_m: 500.0,
         friction_velocity_m_s: 0.28, sensible_heat_flux_w_m2:  40.0}

  domain:
    origin_lon: -121.75
    origin_lat: 39.15
    x_min: -4300.0
    x_max:  4300.0
    y_min: -4450.0
    y_max:  4450.0
    spacing_m: 100.0
    receptor_height_m: 2.0
    heights_m: [100.0]

  sources:
    - id: leak
      x_m: 0.0
      y_m: 0.0
      alt_m: 5.0
      emission_rate_kg_s: 2.7777778e-2   # 100 kg/hr

  receptors:
    - {id: tower_n, x_m:    0.0, y_m:  650.0, alt_m: 3.0}
    - {id: tower_e, x_m:  600.0, y_m:    0.0, alt_m: 3.0}
    - {id: tower_s, x_m:    0.0, y_m: -650.0, alt_m: 3.0}

  flexpart:
    executable: ../../flexpart/src/FLEXPART
    options_dir: ../../flexpart/options
    # Bundled test met (2009-01-01) plus our fixture AVAILABLE.
    meteo_dir: ../../flexpart/tests/testdata
    available_file: ../../tests/fixtures/flexpart_meteo/AVAILABLE
    n_particles: 100000
    species_number: 24
    output_step_seconds: 3600
    sync_seconds: 900
