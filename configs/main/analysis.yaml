# ============================================================================
# Analysis stage — information-content diagnostics + plots.
# ============================================================================
#   enforceflux analysis --config configs/main/analysis.yaml
#
# Reads either an instrument RunDir (preferred — gives DFS, averaging kernel,
# posterior uncertainty from the operator + noise model) or a dispersion RunDir
# (simulation-only diagnostics), and writes a summary bundle under
# runs/<run.name>/analysis/.
#
# ── STAGE INPUTS/OUTPUTS ────────────────────────────────────────────────────
# Consumes: instrument.obs                (preferred, full diagnostics)
#           dispersion.concentration_field (fallback, sim-only)
# Produces: analysis.summary  (summary.json)
#           analysis.plot_*   (plots/*.png, when visualization.enabled)
#
# Run the upstream stage(s) first, e.g.:
#     enforceflux dispersion --config configs/single_source_aermod/dispersion.yaml
#     enforceflux instrument --config configs/main/instrument.yaml
# then either edit the inputs paths below or reuse this pair verbatim.
# ============================================================================

stage: analysis

run:
  name: main

inputs:
  # Preferred: full info-content diagnostics come from the instrument stage.
  instrument: ../../runs/main/instrument
  # Fallback (used when `instrument` is absent):
  # dispersion: ../../runs/single_source_aermod/dispersion

analysis:

  input:
    # auto        — detect from the file's variables (recommended).
    # simulation  — force: treat as a raw concentration field.
    # instrument  — force: expect observations, H·G and R.
    kind: auto

    # Candidate variable names tried in order when reading a raw dispersion
    # field. Extend if your field uses a different name.
    simulation_variable_names: [concentration, ch4_mixing_ratio, ch4_concentration]

  # Prior covariance S_a. Information content is measured RELATIVE to the
  # prior, so these values set what "informative" means.
  analysis:
    prior_variance: 1.0
    # prior_covariance_diag: [1.0, 1.0, 1.0]   # per-source override

  visualization:
    enabled: true
    # Plots land under {run_dir}/plots/; the `directory:` key from the legacy
    # config is now injected by the driver.

    # Which slice to render for field plots.
    time_index: 0
    level_index: 0
    release_index: 0

    # Wind rose from a met file — the distribution of wind directions over
    # the window; often the single best predictor of which sources a fixed
    # network can actually see.
    wind_rose:
      enabled: false
      # netcdf: <path to a met file with u10 / v10 vars>
      u_var: u10
      v_var: v10
      n_dir_bins: 16
      calm_threshold: 0.2
      title: Wind Rose
      cmap: viridis
      output_name: wind_rose.png
