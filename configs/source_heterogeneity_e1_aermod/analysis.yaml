# ============================================================================
# Source-heterogeneity OSSE — Experiment E1 (AERMOD proxy) — Analysis stage.
# ============================================================================
#   enforceflux analysis --config configs/source_heterogeneity_e1_aermod/analysis.yaml
#
# --- source-heterogeneity OSSE (M4) ---
# Points at the dispersion + flux RunDirs (not instrument) so the analysis
# driver takes the source-heterogeneity-only branch and emits E_Q from the
# coarse posterior back to the fine truth grid. Mirrors Agent E's E0 anchor.
# --- end M4 ---
# ============================================================================

stage: analysis

run:
  name: source_heterogeneity_e1_aermod

inputs:
  dispersion: ../../runs/source_heterogeneity_e1_aermod/dispersion
  flux:       ../../runs/source_heterogeneity_e1_aermod/flux

analysis:

  input:
    kind: simulation
    simulation_variable_names: [concentration, ch4_mixing_ratio, ch4_concentration]

  analysis:
    prior_variance: 1.0e-8

  visualization:
    enabled: false
