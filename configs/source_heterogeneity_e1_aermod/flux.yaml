# ============================================================================
# Source-heterogeneity OSSE — Experiment E1 (AERMOD proxy) — Flux stage.
# ============================================================================
#   enforceflux flux --config configs/source_heterogeneity_e1_aermod/flux.yaml
#
# BASE flux config for the M4 sweep. sweep.yaml overrides
# `flux.inversion.prior_covariance.L_B_m`.
#
# --- source-heterogeneity OSSE (M4) ---
# Uses `prebuilt_operator` mode (matches Agent E's E0 anchor) so no upstream
# instrument RunDir is required: the M4 sweep driver runs dispersion in
# operator mode, and the flux stage consumes jacobian.npz + basis_mapping.npz
# directly.
# --- end M4 ---
# ============================================================================

stage: flux

run:
  name: source_heterogeneity_e1_aermod

inputs:
  dispersion: ../../runs/source_heterogeneity_e1_aermod/dispersion

flux:

  input:
    mode: prebuilt_operator
    level_index: 0

  observations:
    default_sigma: 0.5
    add_noise: false
    random_seed: 42

  inversion:
    method: linear
    prior_flux_kg_s: 0.0

    prior_covariance:
      model: gaussian_process
      sigma_kg_s: 1.0e-2
      L_B_m: 800.0

    prior_variance: 1.0e-4
    prior_sigma_fraction: 0.5

    n_iter: 20
    lam0: 1.0e-3
    lam_factor: 10.0
    eps: 1.0e-4
    fd_step: 1.0e-5
