# 30-minute, high-frequency LES experiment for an eddy-covariance operator.
# The 30-minute analysis period follows a 30-minute turbulence spin-up.

transport:
  model: microhh
  mode: simulation
  start: "2020-03-31T18:00:00"
  end:   "2020-03-31T21:00:00"

met:
  era5:
    meteo_dir: ../runs/sacramento_valley_2020/meteo_april_week
    surface_roughness_m: 0.15
    friction_velocity: log_law

domain:
  origin_lon: -121.75
  origin_lat: 39.15
  x_min: -4300.0
  x_max:  4300.0
  y_min: -4450.0
  y_max:  4450.0
  spacing_m: 100.0
  receptor_height_m: 4.0

sources:
  - id: paddy
    x_m: 0.0
    y_m: 0.0
    alt_m: 0.0
    emission_rate_kg_s: 1.35e-4

# Four candidate EC locations: within-field, downwind edge, downwind fetch,
# and upwind control. Column files contain w, CH4, ustar, and Obukhov length.
receptors:
  - {id: field_centre, x_m:    0.0, y_m:    0.0, alt_m: 4.0}
  - {id: edge_down,    x_m:  -51.3, y_m:  141.0, alt_m: 4.0}
  - {id: fetch_350,    x_m: -119.7, y_m:  328.9, alt_m: 4.0}
  - {id: upwind,       x_m:   51.3, y_m: -141.0, alt_m: 4.0}

output:
  path: ../runs/sacramento_paddy_ec_30m/canonical.nc
  compress: true
  keep_native: true

microhh:
  executable: ../microhh/build/microhh
  num_workers: 4
  surface_flux_sources:
    paddy: {side_m: 300.0}

  grid:
    itot: 192
    jtot: 96
    ktot: 96
    xsize: 3840.0
    ysize: 1920.0
    zsize: 2048.0
    dz_surface_m: 2.0
    dz_max_m: 32.0

  source_x0: 960.0
  cross_xy_m: 3.1
  cross_xz_m: 960.0

  spinup_seconds: 1800
  runtime_seconds: 1800

  # Keep high-frequency output only where EC needs it. A shared 2 s cadence
  # would create hundreds of unnecessary full cross-sections.
  sampletime: 10
  column_sampletime: 2
  stats_sampletime: 10
  cross_sampletime: 300
  met_reduce: mean

  extra_ini:
    dump:
      swdump: 1
      dumplist: ch4
      sampletime: 300
